<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Perpustakaan Buku Cerita Interaktif</title>
  
  <!-- Konfigurasi PWA & Layar Utama -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#58cc02">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Storybook">
  <link rel="apple-touch-icon" href="./images/icon-192.png">

  <!-- Berkas Gaya Tampilan & Animasi 3D -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">

    <!-- ================= 1. HALAMAN BERANDA (RAK BUKU) ================= -->
    <div id="homeView" class="view-screen">
      <div class="home-header">
        <div class="header-title">
          <h1>📖 Perpustakaan Cerita</h1>
          <p>Pilih buku cerita bergambar yang ingin kamu baca:</p>
        </div>
        <button class="btn-tool" id="btnThemeToggleHome" title="Ganti Mode Malam">🌙</button>
      </div>

      <div class="stories-grid" id="storiesGrid">
        <!-- Kartu cerita di-render secara otomatis oleh app.js -->
      </div>
    </div>

    <!-- ================= 2. HALAMAN PEMBACA CERITA ================= -->
    <div id="readerView" class="view-screen" style="display: none;">
      
      <!-- Top Navigation Bar -->
      <div class="top-bar">
        <button class="btn-tool" id="btnBackHome" title="Kembali ke Beranda">🏠</button>
        <button class="btn-tool" id="btnThemeToggleReader" title="Ganti Mode Malam">🌙</button>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="page-indicator" id="pageIndicator">1/20</div>
      </div>

      <!-- 3D Book Stage (Mendukung Touch Swipe) -->
      <div class="book-stage" id="bookStage">
        <div class="page-sheet" id="pageSheet">
          <div class="image-frame">
            <img id="storyImage" src="" alt="Ilustrasi Cerita">
          </div>
          <div class="page-body">
            <button class="btn-speaker" id="btnPageAudio" title="Dengarkan narasi halaman ini">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="text-flow" id="textFlow"></div>
          </div>
        </div>
      </div>

      <!-- Kuis Pemahaman Bacaan -->
      <div class="quiz-view" id="quizView" style="display: none;">
        <div id="quizQuestionBox">
          <div class="quiz-header">
            <h2>🎯 Kuis Pemahaman</h2>
            <span class="quiz-step" id="quizStep">1/4</span>
          </div>
          <p class="quiz-question" id="quizQuestionText"></p>
          <div class="quiz-options" id="quizOptions"></div>
        </div>

        <div class="quiz-result" id="quizResult" style="display: none;">
          <div class="stars-box" id="starsBox">⭐⭐⭐</div>
          <div class="result-score" id="resultScore">100</div>
          <p class="result-msg" id="resultMsg"></p>
          <div class="quiz-result-actions">
            <button class="btn-action btn-action-prev" id="btnRestartStory">Baca Ulang</button>
            <button class="btn-action btn-action-next" id="btnFinishToHome">Selesai & Ke Beranda</button>
          </div>
        </div>
      </div>

      <!-- Navigasi Bawah -->
      <div class="action-controls" id="navControls">
        <button class="btn-action btn-action-prev" id="btnPrev" disabled>Sebelumnya</button>
        <button class="btn-action btn-action-next" id="btnNext">Balik Halaman</button>
      </div>

    </div>

  </div>

  <!-- Audio Player Utama -->
  <audio id="audioElement"></audio>

  <!-- ================= DAFTAR CERITA ================= -->
  <!-- Tambahkan script cerita baru di atas app.js -->
  <script src="js/stories/arka.js"></script>

  <!-- ================= MESIN UTAMA ================= -->
  <script src="js/app.js"></script>

  <!-- Pendaftaran PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker aktif:', reg.scope))
          .catch(err => console.log('Service Worker gagal:', err));
      });
    }
  </script>
</body>
</html>
