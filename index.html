<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Perpustakaan Buku Cerita Interaktif</title>
  
  <!-- Konfigurasi PWA & Layar Utama -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#58cc02">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BukuCerita">
  <link rel="apple-touch-icon" href="./images/icon-192.png">

  <!-- Berkas Gaya Tampilan -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Canvas Overlay Konfeti -->
  <canvas id="confettiCanvas"></canvas>

  <div class="app-container">

    <!-- ================= SATU-SATUNYA BANNER INSTAL PWA ================= -->
    <div id="pwaInstallBanner" class="pwa-install-banner" style="display: none;">
      <div class="pwa-banner-content">
        <span class="pwa-icon">📲</span>
        <div class="pwa-text">
          <strong>Pasang Aplikasi Cerita</strong>
          <p>Baca buku tanpa internet langsung dari layar perangkatmu!</p>
        </div>
      </div>
      <div class="pwa-banner-actions">
        <button id="btnInstallPwa" class="btn-install-now">Pasang</button>
        <button id="btnCloseInstallBanner" class="btn-close-banner">✕</button>
      </div>
    </div>

    <!-- ================= 1. HALAMAN BERANDA ================= -->
    <div id="homeView" class="view-screen">
      <div class="home-header">
        <div class="header-title">
          <div class="title-row">
            <h1>📖 Perpustakaan Cerita</h1>
            <div class="network-badge online" id="networkStatus">
              <span class="status-dot"></span>
              <span class="status-text">Online</span>
            </div>
          </div>
          <p>Pilih buku cerita bergambar yang ingin kamu baca:</p>
        </div>
        <div class="header-tools">
          <!-- Widget Kontrol Musik Latar (Tombol & Slider Volume) -->
          <div class="bgm-widget" id="bgmWidget">
            <button class="btn-tool" id="btnBgmToggle" title="Musik Latar: AKTIF (Klik untuk mematikan)">🎵</button>
            <div class="bgm-slider-box">
              <input type="range" id="bgmVolumeSlider" class="bgm-slider" min="0" max="1" step="0.05" value="0.35" title="Volume Musik Latar">
            </div>
          </div>
          <!-- Tombol Cek Pembaruan Cerita -->
          <button class="btn-tool" id="btnCheckUpdate" title="Cek Update Cerita">🔄</button>
          <button class="btn-tool" id="btnResetHistory" title="Reset Riwayat Bintang & Nilai">🗑️</button>
          <button class="btn-tool" id="btnFullScreenHome" title="Layar Penuh (Full Screen)">⛶</button>
          <button class="btn-tool" id="btnThemeToggleHome" title="Ganti Mode Malam">🌙</button>
        </div>
      </div>

      <div class="stories-grid" id="storiesGrid"></div>
    </div>

    <!-- ================= 2. HALAMAN PEMBACA CERITA ================= -->
    <div id="readerView" class="view-screen" style="display: none;">
      
      <!-- Top Navigation Bar -->
      <div class="top-bar">
        <button class="btn-tool" id="btnBackHome" title="Kembali ke Beranda">🏠</button>
        
        <!-- Tombol Sakelar Dwibahasa -->
        <button class="btn-tool" id="btnLangToggle" title="Ganti Bahasa (English / Indonesia)" style="display: none;">🌐 EN</button>
        
        <!-- Tombol Pengatur Kecepatan Suara TTS -->
        <button class="btn-tool" id="btnSpeedToggle" title="Kecepatan Suara: Normal (Klik untuk Mode Lambat)">🐇</button>
        
        <!-- Tombol Toggle Animasi Karaoke Teks (On/Off) -->
        <button class="btn-tool" id="btnKaraokeToggle" title="Animasi Karaoke: AKTIF (Klik untuk mematikan)">🎤 ON</button>
        
        <button class="btn-tool" id="btnAutoPlayToggle" title="Narasi Otomatis (On/Off)">📢</button>
        <button class="btn-tool" id="btnFullScreenReader" title="Layar Penuh (Full Screen)">⛶</button>
        <button class="btn-tool" id="btnThemeToggleReader" title="Ganti Mode Malam">🌙</button>
        
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="page-indicator" id="pageIndicator">1/20</div>
      </div>

      <!-- 3D Book Stage -->
      <div class="book-stage" id="bookStage">
        <div class="page-sheet" id="pageSheet">
          <div class="image-frame">
            <img id="storyImage" src="" alt="Ilustrasi Cerita">
          </div>
          <div class="page-body">
            <button class="btn-speaker" id="btnPageAudio" title="Dengarkan narasi halaman ini">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="text-flow" id="textFlow"></div>
          </div>
        </div>
      </div>

      <!-- Kuis Pemahaman Bacaan -->
      <div class="quiz-view" id="quizView" style="display: none;">
        <div id="quizQuestionBox">
          <div class="quiz-header">
            <h2>🎯 Kuis Pemahaman</h2>
            <span class="quiz-step" id="quizStep">1/4</span>
          </div>
          <p class="quiz-question" id="quizQuestionText"></p>
          <div class="quiz-options" id="quizOptions"></div>
        </div>

        <div class="quiz-result" id="quizResult" style="display: none;">
          <div class="stars-box" id="starsBox">⭐⭐⭐</div>
          <div class="result-score" id="resultScore">100</div>
          <p class="result-msg" id="resultMsg"></p>
          <div class="quiz-result-actions">
            <button class="btn-action btn-action-prev" id="btnRestartStory">Baca Ulang</button>
            <button class="btn-action btn-action-next" id="btnFinishToHome">Selesai & Ke Beranda</button>
          </div>
        </div>
      </div>

      <!-- Navigasi Bawah -->
      <div class="action-controls" id="navControls">
        <button class="btn-action btn-action-prev" id="btnPrev" disabled>Sebelumnya</button>
        <button class="btn-action btn-action-next" id="btnNext">Balik Halaman</button>
      </div>

    </div>

  </div>
  <!-- Pemutar Musik Latar Beranda -->
  <audio id="bgmAudio" loop preload="auto" src="audio/bgm-home.mp3"></audio>
  <audio id="audioElement"></audio>

  <!-- ================= DAFTAR BUKU CERITA MODULAR ================= -->
  <script src="js/stories/giska.js"></script>
  <script src="js/stories/kiko.js"></script>
  <script src="js/stories/mimi.js"></script>
  <script src="js/stories/piko.js"></script>
  <script src="js/stories/dodi.js"></script>
  <script src="js/stories/arka.js"></script>
  <script src="js/stories/aisyah.js"></script>
  <script src="js/stories/avis.js"></script>
  <script src="js/stories/dani&naomi.js"></script>
  <script src="js/stories/lala.js"></script>
  <script src="js/stories/keysa&sena.js"></script>
  <script src="js/stories/alfa.js"></script>
  <script src="js/stories/hanan.js"></script>
  <script src="js/stories/thoriq.js"></script>
  <script src="js/stories/kenzo.js"></script>
  <script src="js/stories/paiman.js"></script>
  <script src="js/stories/saiman.js"></script>
  <script src="js/stories/ara.js"></script>
  <!-- ================= MESIN APLIKASI UTAMA ================= -->
  <script src="js/app.js"></script>

  <!-- Registrasi Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW terdaftar:', reg.scope))
          .catch(err => console.log('SW gagal:', err));
      });
    }
  </script>
</body>
</html>
